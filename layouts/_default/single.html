{{ define "main" }}
<article class="article shell-narrow">
  <header class="article-header">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="standfirst">{{ . }}</p>{{ end }}
    {{ with .Date }}<p class="article-date"><time datetime="{{ .Format "2006-01-02" }}">{{ .Format "2 January 2006" }}</time></p>{{ end }}
  </header>
  <div class="prose">
    {{ .Content }}
  </div>
</article>
{{ end }}
