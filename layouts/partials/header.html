<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}">
      <img src="{{ "brand-mark.svg" | relURL }}" width="42" height="42" alt="">
      <strong class="brand-name">The Code Less Taken</strong>
    </a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="{{ "writing/" | relURL }}"{{ if eq .Section "writing" }} aria-current="page"{{ end }}>Writing</a>
    </nav>
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Change color mode">
      <span class="theme-dot" aria-hidden="true"></span>
      <span data-theme-label>Auto</span>
    </button>
  </div>
</header>
